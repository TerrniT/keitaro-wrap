services:
  app:
    build: .
    container_name: keitaro-wrapper
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # The entrypoint applies Alembic migrations before starting uvicorn.
      AUTO_CREATE_TABLES: "false"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
